{% extends 'base.html' %}

{% block title %}Page Not Found (404) – Adopt n Shop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="d-inline-flex p-4 rounded-circle bg-warning-subtle text-warning mb-4">
      <i class="bi bi-question-circle fs-1" style="font-size: 3.5rem !important;"></i>
    </div>
    <h1 class="display-5 fw-bold mb-3">404 – Page Not Found</h1>
    <p class="lead text-muted mx-auto mb-4" style="max-width: 500px;">
      Oops! The pet profile, supply listing, or page you were looking for seems to have wandered off.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
        <i class="bi bi-house me-1"></i> Return to Homepage
      </a>
      <a href="{{ url_for('pets_list') }}" class="btn btn-secondary-custom px-4 py-2">
        <i class="bi bi-balloon-heart me-1"></i> Browse Pets
      </a>
      <a href="{{ url_for('shop_list') }}" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-bag me-1"></i> Pet Shop
      </a>
    </div>
  </div>
</div>
{% endblock %}
