{% extends 'base.html' %}

{% block title %}Internal Server Error (500) – Adopt n Shop{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="d-inline-flex p-4 rounded-circle bg-danger-subtle text-danger mb-4">
      <i class="bi bi-exclamation-octagon fs-1" style="font-size: 3.5rem !important;"></i>
    </div>
    <h1 class="display-5 fw-bold mb-3">500 – Server Error</h1>
    <p class="lead text-muted mx-auto mb-4" style="max-width: 500px;">
      Something went wrong on our end while processing your request. Please try again in a few moments.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4 py-2">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
